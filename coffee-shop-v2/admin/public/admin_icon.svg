<svg viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
  <!-- Coffee cup with admin elements -->
  <g transform="translate(12, 12)">
    <!-- Cup body -->
    <path d="M8 40 L8 18 Q8 14 12 14 L32 14 Q36 14 36 18 L36 40 Q36 44 32 44 L12 44 Q8 44 8 40 Z" 
          fill="#f8f8f8" 
          stroke="#e91e63" 
          stroke-width="2"/>
    
    <!-- Coffee surface -->
    <ellipse cx="22" cy="18" rx="10" ry="2" fill="#fce4ec"/>
    
    <!-- Handle -->
    <path d="M36 22 Q42 22 42 30 Q42 38 36 38" 
          fill="none" 
          stroke="#e91e63" 
          stroke-width="2"/>
    
    <!-- Admin gear overlay -->
    <g transform="translate(20, 28)">
      <!-- Gear teeth -->
      <path d="M0 -8 L2 -8 L3 -10 L5 -10 L6 -8 L8 -8 L8 -6 L10 -5 L10 -3 L8 -2 L8 0 L6 0 L5 2 L3 2 L2 0 L0 0 L0 -2 L-2 -3 L-2 -5 L0 -6 Z" 
            fill="#e91e63" 
            opacity="0.9"/>
      
      <!-- Center circle -->
      <circle cx="4" cy="-4" r="3" fill="#ffffff" stroke="#e91e63" stroke-width="1"/>
      
      <!-- Inner dot -->
      <circle cx="4" cy="-4" r="1.5" fill="#e91e63"/>
    </g>
    
    <!-- Subtle steam -->
    <g opacity="0.5">
      <path d="M18 8 Q18 4 19 6 Q19 2 20 4" 
            fill="none" 
            stroke="#e91e63" 
            stroke-width="1.5" 
            stroke-linecap="round"/>
      <path d="M24 8 Q24 4 25 6 Q25 2 26 4" 
            fill="none" 
            stroke="#e91e63" 
            stroke-width="1.5" 
            stroke-linecap="round"/>
    </g>
  </g>
  
  <!-- Admin indicator dots -->
  <g transform="translate(58, 15)">
    <circle cx="0" cy="0" r="2" fill="#e91e63"/>
    <circle cx="0" cy="8" r="2" fill="#e91e63" opacity="0.6"/>
    <circle cx="0" cy="16" r="2" fill="#e91e63" opacity="0.3"/>
  </g>
</svg>